services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - FEED_DIR=/data
      - DATABASE_URL=${DATABASE_URL}
      - IFTTT_WEBHOOK_URL=${IFTTT_WEBHOOK_URL}
      - INTERVAL=${INTERVAL:-600}
      - POST_DELAY=${POST_DELAY:-225}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    volumes:
      - rss_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rss_data:
    driver: local
